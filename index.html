<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الرئيسية</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f4f4f4;
        }
        header {
            background: #35424a;
            color: #ffffff;
            padding: 1rem 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 2rem 0;
        }
        .content {
            background: #ffffff;
            padding: 2rem;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            text-align: center;
            padding: 1rem 0;
            background: #35424a;
            color: #ffffff;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>مرحباً بكم في صفحتي</h1>
    </header>
    <div class="container">
        <div class="content">
            <h2>عن الموقع</h2>
            <p>هذا مثال لصفحة ويب تم تحسين شكلها لتصبح أكثر جاذبية وتنظيماً.</p>
            <p>يمكنك تعديل المحتوى حسب احتياجاتك.</p>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 جميع الحقوق محفوظة</p>
    </footer>
</body>
</html>
